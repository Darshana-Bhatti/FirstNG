<div class="form-container">
    <form [formGroup]="registrationForm" (ngSubmit)=" onRegister()">
    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" placeholder="name" name="name" formControlName="name">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" placeholder="email" name="email" formControlName="email">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" placeholder="password" name="password" formControlName="password">
    </div>
    <button type="submit">Register</button>
    <a routerLink="login">Already have account? login</a>
</form>
</div>
